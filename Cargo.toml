[package]
name = "native-gpui"
version = "0.1.0"
edition = "2021"
description = "Real AppKit controls, materials and macOS 26 liquid glass hosted inside a GPUI window"
license = "MIT"
publish = false

[workspace]
members = ["crates/*"]

[lib]
name = "native_gpui"
path = "src/lib.rs"

[features]
default = []
# Undocumented material values and private AppKit selectors. Off by default: the semantic
# `Material` set and the public glass API are the supported surface.
private-api = []

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "90d8514059561f0e44af0a32e84e1c329cef3232" }
image = "0.25"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "QLPreviewItem",
    "QLPreviewPanel",
] }
objc2-quick-look-thumbnailing = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "QLThumbnailGenerationRequest",
    "QLThumbnailGenerator",
    "QLThumbnailRepresentation",
] }
# `font-kit` and `screen-capture` are optional upstream; this crate needs both.
gpui_macos = { git = "https://github.com/Cafekery/gpui-macos", rev = "80acec4df984c8f2461e1d2a5f779bb0cff18d8e", features = [
    "font-kit",
    "screen-capture",
] }

[dev-dependencies]
convert = { path = "crates/convert" }
finder-fs = { path = "crates/finder-fs" }
fsearch = { path = "crates/fsearch" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "90d8514059561f0e44af0a32e84e1c329cef3232", features = ["font-kit"] }
parking_lot = "0.12"

[[example]]
name = "custom_glass"
path = "examples/custom_glass.rs"
required-features = ["private-api"]

[[example]]
name = "glass_variants"
path = "examples/glass_variants.rs"
required-features = ["private-api"]

[profile.release]
# Thin LTO cost 4x on every rebuild and bought no frames: measured 119.2 scroll and 106 resize
# unique frames/s without it, against 119.2 and 93 with it.
lto = false
incremental = true

[patch."https://github.com/zed-industries/zed"]
gpui_macos = { git = "https://github.com/Cafekery/gpui-macos", rev = "80acec4df984c8f2461e1d2a5f779bb0cff18d8e" }
