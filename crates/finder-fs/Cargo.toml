[package]
name = "finder-fs"
version = "0.1.0"
edition = "2021"
description = "The file system behind the Finder demo: fast listings, watching and file operations"
license = "MIT"
publish = false

[lib]
name = "finder_fs"
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFArray", "CFLocale", "CFNumber", "CFRunLoop", "CFString", "CFURL"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["FSEvents", "LSSharedFileList", "SharedFileList"] }
objc2-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
