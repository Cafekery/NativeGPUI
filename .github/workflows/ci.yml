name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: rustup update stable && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: cargo build --release --examples
      - run: cargo build --release --examples --features private-api
      - run: cargo build --release -p founder
      - run: cargo test --release --lib
      - run: cargo test --release -p finder-fs -p fsearch -p founder-cli -p finder-sftp
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: ./scripts/surface.sh

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-26
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' founder/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_ENV"
          gh release view "v$version" >/dev/null 2>&1 || echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: |
          {
            ./founder/scripts/notes.sh "$version"
            printf '\nUnsigned: move it to Applications, open it, then allow it under System Settings > Privacy & Security.\n'
          } > "$RUNNER_TEMP/notes.md"
      - if: steps.version.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: release-${{ hashFiles('Cargo.lock') }}
      - if: steps.version.outputs.publish == 'true'
        run: rustup update stable && rustup default stable
      - if: steps.version.outputs.publish == 'true'
        run: cargo about --version || cargo install cargo-about --locked --features cli
      - if: steps.version.outputs.publish == 'true'
        run: ./founder/scripts/release.sh
      - if: steps.version.outputs.publish == 'true'
        run: |
          gh release create "v$version" dist/Founder.zip dist/Founder.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Found'er $version" \
            --latest \
            --notes-file "$RUNNER_TEMP/notes.md"
