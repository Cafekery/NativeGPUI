name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GPUI_MACOS_DEPLOY_KEY" > ~/.ssh/gpui_macos
          chmod 600 ~/.ssh/gpui_macos
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/gpui_macos\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."git@github.com:Cafekery/gpui-macos".insteadOf "https://github.com/Cafekery/gpui-macos"
        env:
          GPUI_MACOS_DEPLOY_KEY: ${{ secrets.GPUI_MACOS_DEPLOY_KEY }}
      - run: rustup update stable && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: cargo build --release --examples
      - run: cargo build --release --examples --features private-api
      - run: cargo test --release --lib
      - run: cargo test --release -p finder-fs -p fsearch -p convert -p founder-cli -p finder-sftp
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: ./scripts/surface.sh
